services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      PROXVM_CONFIG_DIR: /data/.proxvm
      PROXVM_PORT: "4000"
      PROXVM_WEB_ORIGIN: ""
      NODE_ENV: production
      # Cloudflare domain automation. Values come from the local .env file
      # (gitignored, never committed); empty means "use the UI settings".
      PROXVM_CLOUDFLARE_API_TOKEN: "${PROXVM_CLOUDFLARE_API_TOKEN:-}"
      PROXVM_CLOUDFLARE_ZONE_ID: "${PROXVM_CLOUDFLARE_ZONE_ID:-}"
      PROXVM_CLOUDFLARE_ACCOUNT_ID: "${PROXVM_CLOUDFLARE_ACCOUNT_ID:-}"
      PROXVM_CLOUDFLARE_TUNNEL_ID: "${PROXVM_CLOUDFLARE_TUNNEL_ID:-}"
    volumes:
      - proxvm-config:/data/.proxvm
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      PROXVM_CONFIG_DIR: /data/.proxvm
      NODE_ENV: production
    volumes:
      - proxvm-config:/data/.proxvm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  overwatch:
    build:
      context: .
      dockerfile: docker/overwatch.Dockerfile
    environment:
      PROXVM_CONFIG_DIR: /data/.proxvm
      NODE_ENV: production
      # NOTE: the process must listen on 0.0.0.0 *inside* the container or
      # published-port traffic never reaches it (accept-then-drop). Setting
      # this to 127.0.0.1 breaks the service — host restriction lives in the
      # ports mapping below, not here.
      PROXVM_OVERWATCH_HOST: "0.0.0.0"
      PROXVM_OVERWATCH_PORT: "4001"
      # Required: god-mode bearer token. Generate with
      # `openssl rand -hex 32` and keep it in the local .env (gitignored).
      # The service refuses every request while this is empty.
      PROXVM_OVERWATCH_TOKEN: "${PROXVM_OVERWATCH_TOKEN:-}"
      # Optional: mount the Docker socket read-only to enable /docker/logs.
      # DOCKER_SOCK: /var/run/docker.sock
    volumes:
      - proxvm-config:/data/.proxvm
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proxvm
      POSTGRES_USER: proxvm
      POSTGRES_PASSWORD: changeme-postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proxvm"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Bounded memory: noeviction fails writes loudly at the cap instead of
    # silently dropping security state (rate limits, lockouts). 512 MB is
    # generous (typical use is single-digit MB); the API already handles
    # enqueue failures explicitly rather than losing jobs.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  proxvm-config:
  pgdata:
    name: proxvm-pgdata
  redis-data: