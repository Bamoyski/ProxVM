server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening headers. No inline scripts, plugins, or third-party
    # resources exist in the bundle, and all API traffic is same-origin, so
    # this policy does not change application behavior.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}