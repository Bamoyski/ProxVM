server {
    listen 80;
    server_name _;

    # Docker's embedded DNS, re-resolved per request (valid=10s). Without
    # this, proxy_pass hostnames resolve ONCE at startup and nginx dials a
    # dead container IP forever after any recreate — the classic mystery 502.
    # Every proxy_pass below therefore goes through a variable (which forces
    # runtime resolution) instead of a static hostname.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline hardening headers. No inline scripts, plugins, or third-party
    # resources exist in the bundle, and all API traffic is same-origin, so
    # this policy does not change application behavior.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # API backends return JSON, so proxy failures must too: intercept
    # nginx's HTML error pages (502/504/524-shaped) and answer with a
    # ProxVM-shaped JSON body the UI renders as a friendly message.
    # Without this, users see raw "HTTP 502" text and browser error pages.
    location /api/ {
        set $upstream_api http://api:4000;
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @api_unavailable;
    }

    # Overwatch console, same-origin so the session cookie rides along.
    # Auth stays entirely in Overwatch (ADMIN session + optional bearer);
    # nginx only strips the prefix and forwards.
    location = /overwatch { return 301 $scheme://$http_host/overwatch/; }
    location /overwatch/ {
        rewrite ^/overwatch/(.*)$ /$1 break;
        set $upstream_ow http://overwatch:4001;
        proxy_pass $upstream_ow;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        internal;
        default_type application/json;
        # 503 either way: the wording covers restarting, crashed, or
        # unreachable backends without leaking internals.
        return 503 '{"code":"BAD_GATEWAY","message":"ProxVM is briefly unavailable — retry in a few seconds."}';
    }

    location / {
        try_files $uri /index.html;
    }
}